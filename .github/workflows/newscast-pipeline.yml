name: AI Newscast Pipeline

on:
  # schedule:
  #   - cron: '5 0 * * *'   # UTC 00:05 (KST 09:05) - daily morning execution
  #   - cron: '5 9 * * *'   # UTC 09:05 (KST 18:05) - daily evening execution
  workflow_dispatch:      # Manual trigger support
    inputs:
      newscast-id:
        description: 'Newscast ID to append topics (optional, uses latest-newscast-id if empty)'
        required: false
        type: string
      topic-limit:
        description: 'Number of topics to crawl (optional, crawls all available if empty)'
        required: false
        type: string
      test-index:
        description: 'Test mode: use mock worker URL with index (1, 2, 3, etc.)'
        required: true
        type: string

env:
  NODE_VERSION: '24'

jobs:
  # Job 1: Crawl Topics (dynamic topic count + news lists)
  crawl-topics:
    runs-on: ubuntu-latest
    outputs:
      newscast-id: ${{ steps.generate-matrix.outputs.newscast-id }}
      topic-matrix: ${{ steps.generate-matrix.outputs.matrix }}
      topic-count: ${{ steps.generate-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Schedule: Let crawler auto-generate (UTC 0:xx) or reuse latest ID (UTC 9:xx)
      - name: Determine newscast ID (schedule)
        id: schedule-id
        if: github.event_name == 'schedule'
        env:
          NEWSCAST_LATEST_ID_WORKER_URL: ${{ vars.NEWSCAST_LATEST_ID_WORKER_URL }}
        run: |
          HOUR=$(date -u +%H)

          if [ "$HOUR" -eq 0 ]; then
            # KST 09:xx - Let crawler auto-generate new ID
            echo "🆕 Crawler will auto-generate new newscast ID (KST 09:xx)"
            echo "newscast-id=" >> $GITHUB_OUTPUT
          else
            # KST 18:xx - Reuse latest-newscast-id from Worker API
            echo "📡 Fetching latest-newscast-id from Worker API..."

            LATEST_ID_RESPONSE=$(curl -s "${NEWSCAST_LATEST_ID_WORKER_URL}/latest")
            NEWSCAST_ID=$(echo "$LATEST_ID_RESPONSE" | jq -r '."latest-newscast-id"')

            if [ -z "$NEWSCAST_ID" ] || [ "$NEWSCAST_ID" == "null" ]; then
              echo "❌ Failed to get latest-newscast-id"
              exit 1
            fi

            echo "♻️ Reusing latest-newscast-id (KST 18:xx): ${NEWSCAST_ID}"
            echo "newscast-id=${NEWSCAST_ID}" >> $GITHUB_OUTPUT
          fi

      # Workflow dispatch: Use input or let crawler auto-generate
      - name: Determine newscast ID (workflow_dispatch)
        id: dispatch-id
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_NEWSCAST_ID: ${{ inputs.newscast-id }}
        run: |
          if [ -n "$INPUT_NEWSCAST_ID" ]; then
            echo "📥 Using input newscast ID: ${INPUT_NEWSCAST_ID}"
            echo "newscast-id=${INPUT_NEWSCAST_ID}" >> $GITHUB_OUTPUT
          else
            echo "🆕 No newscast-id input - crawler will auto-generate new ID"
            echo "newscast-id=" >> $GITHUB_OUTPUT
          fi

      # Download existing topics.json if newscast-id is provided
      - name: Download existing topics
        id: existing-topics
        env:
          NEWSCAST_R2_PUBLIC_URL: ${{ vars.NEWSCAST_R2_PUBLIC_URL }}
          NEWSCAST_ID: ${{ steps.schedule-id.outputs.newscast-id || steps.dispatch-id.outputs.newscast-id }}
        run: |
          if [ -n "$NEWSCAST_ID" ]; then
            echo "🔍 Checking for existing topics.json in R2..."
            R2_TOPICS_URL="${NEWSCAST_R2_PUBLIC_URL}/newscasts/${NEWSCAST_ID}/topics.json"
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/existing-topics.json "$R2_TOPICS_URL")

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Found existing topics.json"
              EXISTING_TOPICS=$(cat /tmp/existing-topics.json)
              EXISTING_COUNT=$(echo "$EXISTING_TOPICS" | jq '.count')
              echo "📊 Existing topics: ${EXISTING_COUNT}"
              echo "📍 Starting offset: ${EXISTING_COUNT}"
              echo "$EXISTING_TOPICS" > /tmp/existing-topics-for-check.json
              echo "offset=${EXISTING_COUNT}" >> $GITHUB_OUTPUT
              echo "has-existing=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Newscast ID '${NEWSCAST_ID}' has no topics.json in R2 (HTTP ${HTTP_CODE})"
              exit 1
            fi
          else
            echo "🆕 No newscast-id - starting from offset 0"
            echo "offset=0" >> $GITHUB_OUTPUT
            echo "has-existing=false" >> $GITHUB_OUTPUT
          fi

      - name: Crawl topics and news lists
        id: topics
        env:
          TEST_INDEX: ${{ inputs.test-index }}
          TOPIC_LIMIT: ${{ inputs.topic-limit }}
        run: |
          NEWSCAST_ID="${{ steps.schedule-id.outputs.newscast-id || steps.dispatch-id.outputs.newscast-id }}"
          OFFSET="${{ steps.existing-topics.outputs.offset }}"
          LIMIT="${TOPIC_LIMIT}"
          HAS_EXISTING="${{ steps.existing-topics.outputs.has-existing }}"

          if [ -n "$NEWSCAST_ID" ]; then
            echo "📰 Crawling topics with newscast-id=${NEWSCAST_ID}, offset=${OFFSET}, limit=${LIMIT:-all available}"
          else
            echo "📰 Crawling topics (auto-generate newscast-id), offset=${OFFSET}, limit=${LIMIT:-all available}"
          fi

          # Build command
          CMD="pnpm run:crawler:news-topics -- --output /tmp/newscast-output --offset ${OFFSET} --test-index ${TEST_INDEX}"

          # Add newscast-id if provided
          if [ -n "$NEWSCAST_ID" ]; then
            CMD="${CMD} --newscast-id ${NEWSCAST_ID}"
          fi

          # Add limit if specified
          if [ -n "$LIMIT" ]; then
            CMD="${CMD} --limit ${LIMIT}"
            echo "🔢 Limit: ${LIMIT} topics"
          else
            echo "🔢 Limit: all available topics"
          fi

          echo "🧪 Test mode: using mock worker URL /${TEST_INDEX}"

          # Add existing topics for duplicate check if available
          if [ "$HAS_EXISTING" == "true" ]; then
            EXISTING_TOPICS=$(cat /tmp/existing-topics-for-check.json | jq -c .)
            CMD="${CMD} --existing-topics '${EXISTING_TOPICS}'"
            echo "🔍 Using existing topics for duplicate detection"
          fi

          # Execute crawl
          eval $CMD

          # Check where output actually was created and move to /tmp if needed
          if [ -d "packages/news-crawler/output" ]; then
            mkdir -p /tmp/newscast-output
            mv packages/news-crawler/output/* /tmp/newscast-output/
          fi

          # Find actual newscast ID from output directory (if not provided as input)
          if [ -z "$NEWSCAST_ID" ]; then
            ACTUAL_DIR=$(ls -d /tmp/newscast-output/202* 2>/dev/null | head -1)
            if [ -z "$ACTUAL_DIR" ]; then
              echo "❌ No newscast output directory found"
              exit 1
            fi
            NEWSCAST_ID=$(basename "$ACTUAL_DIR")
            echo "📁 Found auto-generated newscast ID: ${NEWSCAST_ID}"
          fi

          echo "✅ Newscast ID: ${NEWSCAST_ID}"
          echo "newscast-id=${NEWSCAST_ID}" >> $GITHUB_OUTPUT

      - name: Generate dynamic topic matrix
        id: generate-matrix
        run: |
          # Use newscast ID from topics step (crawler's actual output)
          NEWSCAST_ID="${{ steps.topics.outputs.newscast-id }}"
          ACTUAL_DIR="/tmp/newscast-output/${NEWSCAST_ID}"

          if [ ! -d "$ACTUAL_DIR" ]; then
            echo "❌ Newscast output directory not found: ${ACTUAL_DIR}"
            exit 1
          fi

          echo "📁 Using newscast directory: ${NEWSCAST_ID}"

          # Extract topic numbers from actual topic-* folders
          cd "$ACTUAL_DIR"

          MATRIX=$(ls -d topic-* 2>/dev/null | \
            sed 's/topic-//' | \
            sort -n | \
            jq -R . | jq -sc .)

          TOPIC_COUNT=$(echo "$MATRIX" | jq 'length')

          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "count=${TOPIC_COUNT}" >> $GITHUB_OUTPUT
          echo "newscast-id=${NEWSCAST_ID}" >> $GITHUB_OUTPUT

          echo "✅ Generated matrix for ${TOPIC_COUNT} topics: ${MATRIX}"

      - name: Upload topics data
        uses: actions/upload-artifact@v4
        with:
          name: topics-data
          path: /tmp/newscast-output/${{ steps.generate-matrix.outputs.newscast-id }}/
          retention-days: 7

  # Job 2: Crawl News Details (parallel: dynamic topics)
  crawl-details-matrix:
    needs: [crawl-topics]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        topic: ${{ fromJson(needs.crawl-topics.outputs.topic-matrix) }}
      max-parallel: 10
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download topics data
        uses: actions/download-artifact@v4
        with:
          name: topics-data
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/

      - name: Crawl news details for topic-${{ matrix.topic }}
        run: |
          TOPIC_INDEX_STRING=${{ matrix.topic }}
          TOPIC_INDEX=$((10#$TOPIC_INDEX_STRING))
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "📰 Crawling news details for topic-${TOPIC_INDEX_STRING}"

          # Extract news IDs from news-list.json
          NEWS_IDS=$(cat /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}/news-list.json | \
            jq -r '.newsIDs | join(",")')

          # Crawl news details (sequential within topic)
          pnpm run:crawler:news-details -- \
            --news-ids "${NEWS_IDS}" \
            --output /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING} \
            --topic-index ${TOPIC_INDEX}

          echo "✅ Completed news details for topic-${TOPIC_INDEX_STRING}"

      - name: Upload topic-${{ matrix.topic }} details
        uses: actions/upload-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-details
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/
          retention-days: 7

  # Job 3: Generate Consolidated News (parallel: dynamic topics)
  generate-news-matrix:
    needs: [crawl-topics, crawl-details-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        topic: ${{ fromJson(needs.crawl-topics.outputs.topic-matrix) }}
      max-parallel: 10
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download topic-${{ matrix.topic }} details
        uses: actions/download-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-details
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/

      - name: Generate consolidated news for topic-${{ matrix.topic }}
        env:
          GOOGLE_GEN_AI_API_KEY: ${{ secrets.GOOGLE_GEN_AI_API_KEY }}
        run: |
          TOPIC_INDEX_STRING=${{ matrix.topic }}
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "🤖 Generating consolidated news for topic-${TOPIC_INDEX_STRING}"

          pnpm run:generator:news -- \
            --input-folder /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}/news \
            --output-file /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}/news.json \
            --model ${{ vars.GEMINI_MODEL }}

          echo "✅ Completed news generation for topic-${TOPIC_INDEX_STRING}"

      - name: Upload topic-${{ matrix.topic }} news
        uses: actions/upload-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-news
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/
          retention-days: 7

  # Job 4: Generate Newscast Script (parallel: dynamic topics)
  generate-script-matrix:
    needs: [crawl-topics, generate-news-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        topic: ${{ fromJson(needs.crawl-topics.outputs.topic-matrix) }}
      max-parallel: 10
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download topic-${{ matrix.topic }} news
        uses: actions/download-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-news
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/

      - name: Generate newscast script for topic-${{ matrix.topic }}
        env:
          GOOGLE_GEN_AI_API_KEY: ${{ secrets.GOOGLE_GEN_AI_API_KEY }}
        run: |
          TOPIC_INDEX_STRING=${{ matrix.topic }}
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "📝 Generating newscast script for topic-${TOPIC_INDEX_STRING}"

          pnpm run:generator:newscast-script -- \
            --input-file /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}/news.json \
            --output-file /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}/newscast-script.json \
            --model ${{ vars.GEMINI_MODEL }}

          echo "✅ Completed script generation for topic-${TOPIC_INDEX_STRING}"

      - name: Upload topic-${{ matrix.topic }} script
        uses: actions/upload-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-script
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/
          retention-days: 7

  # Job 5: Generate TTS Audio (parallel: dynamic topics)
  generate-audio-matrix:
    needs: [crawl-topics, generate-script-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        topic: ${{ fromJson(needs.crawl-topics.outputs.topic-matrix) }}
      max-parallel: 10
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download topic-${{ matrix.topic }} script
        uses: actions/download-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-script
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/

      - name: Generate TTS audio for topic-${{ matrix.topic }}
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          TTS_DELAY_MS: '500'
        run: |
          TOPIC_INDEX_STRING=${{ matrix.topic }}
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "🎙️ Generating TTS audio for topic-${TOPIC_INDEX_STRING}"

          pnpm run:generator:newscast-audio -- \
            --input-file /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}/newscast-script.json \
            --output-dir /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}

          echo "✅ Completed audio generation for topic-${TOPIC_INDEX_STRING}"

      - name: Upload topic-${{ matrix.topic }} audio
        uses: actions/upload-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-audio
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/
          retention-days: 7

  # Job 6: Merge Newscast Audio (parallel: dynamic topics)
  merge-newscast-matrix:
    needs: [crawl-topics, generate-audio-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        topic: ${{ fromJson(needs.crawl-topics.outputs.topic-matrix) }}
      max-parallel: 10
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download topic-${{ matrix.topic }} audio
        uses: actions/download-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-audio
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/

      - name: Merge audio files for topic-${{ matrix.topic }}
        run: |
          TOPIC_INDEX_STRING=${{ matrix.topic }}
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "🎵 Merging audio files for topic-${TOPIC_INDEX_STRING}"

          pnpm run:generator:newscast -- \
            --input-dir /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}

          echo "✅ Completed audio merge for topic-${TOPIC_INDEX_STRING}"

      - name: Upload topic-${{ matrix.topic }} final newscast
        uses: actions/upload-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-final
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/
          retention-days: 7

  # Job 7: Upload topics data to R2
  upload-topics-to-r2:
    needs: [crawl-topics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download topics data
        uses: actions/download-artifact@v4
        with:
          name: topics-data
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/

      - name: Upload topics.json and topics.html to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: |
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "📤 Uploading topics data (topics.json, topics.html) to R2"

          pnpm run:uploader:upload -- \
            --input-dir /tmp/newscast-output/${NEWSCAST_ID} \
            --prefix newscasts/${NEWSCAST_ID}

          echo "✅ Completed topics data upload"

  # Job 8: Upload to R2 (parallel: dynamic topics)
  upload-to-r2-matrix:
    needs: [crawl-topics, merge-newscast-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        topic: ${{ fromJson(needs.crawl-topics.outputs.topic-matrix) }}
      max-parallel: 10
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download topic-${{ matrix.topic }} final newscast
        uses: actions/download-artifact@v4
        with:
          name: topic-${{ matrix.topic }}-final
          path: /tmp/newscast-output/${{ needs.crawl-topics.outputs.newscast-id }}/topic-${{ matrix.topic }}/

      - name: Upload topic-${{ matrix.topic }} to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: |
          TOPIC_INDEX_STRING=${{ matrix.topic }}
          TOPIC_INDEX=$((10#$TOPIC_INDEX_STRING))
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "📤 Uploading topic-${TOPIC_INDEX_STRING} to R2"

          pnpm run:uploader:upload -- \
            --input-dir /tmp/newscast-output/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING} \
            --prefix newscasts/${NEWSCAST_ID}/topic-${TOPIC_INDEX_STRING}

          echo "✅ Completed R2 upload for topic-${TOPIC_INDEX_STRING}"

  # Job 9: Update latest-newscast-id (single job)
  update-latest-id:
    needs: [crawl-topics, upload-to-r2-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Update latest-newscast-id via Worker API
        env:
          NEWSCAST_LATEST_ID_WORKER_URL: ${{ vars.NEWSCAST_LATEST_ID_WORKER_URL }}
        run: |
          NEWSCAST_ID=${{ needs.crawl-topics.outputs.newscast-id }}

          echo "🔄 Updating latest-newscast-id to ${NEWSCAST_ID}"

          # Call Worker API to update KV
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${NEWSCAST_LATEST_ID_WORKER_URL}/update" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${NEWSCAST_ID}\"}")

          # Extract HTTP status code (last line)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          # Extract response body (all lines except last)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "📊 Response: ${BODY}"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Latest newscast ID updated to ${NEWSCAST_ID}"
          else
            echo "❌ Failed to update latest-newscast-id (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Generate workflow summary
        run: |
          TOPIC_COUNT=${{ needs.crawl-topics.outputs.topic-count }}

          echo "## ✅ Newscast Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Newscast ID**: \`${{ needs.crawl-topics.outputs.newscast-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Topics processed**: ${TOPIC_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "**Upload location**: \`newscasts/${{ needs.crawl-topics.outputs.newscast-id }}/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Topic crawling completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ News details crawled (${TOPIC_COUNT} topics in parallel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Consolidated news generated (${TOPIC_COUNT} topics in parallel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Newscast scripts generated (${TOPIC_COUNT} topics in parallel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TTS audio generated (${TOPIC_COUNT} topics in parallel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Audio files merged (${TOPIC_COUNT} topics in parallel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Files uploaded to R2 (${TOPIC_COUNT} topics in parallel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Latest newscast ID updated" >> $GITHUB_STEP_SUMMARY
