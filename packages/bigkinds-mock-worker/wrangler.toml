name = "ai-newscast-bigkinds-mock-worker"
main = "dist/worker.js"
compatibility_date = "2024-06-29"

# R2 Bucket binding
[[r2_buckets]]
binding = "AI_NEWSCAST_R2"
bucket_name = "ai-newscast"
preview_bucket_name = "ai-newscast"

# Local development settings
[env.development]
r2_buckets = [
  { binding = "AI_NEWSCAST_R2", bucket_name = "ai-newscast", preview_bucket_name = "ai-newscast" }
]
